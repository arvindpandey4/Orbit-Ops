version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: task_management_redis
    restart: always
    ports:
      - "6380:6379" # Changed host port to 6380 to avoid conflicts
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - task_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: task_management_rabbitmq
    restart: always
    ports:
      - "5673:5672"   # Changed host port to 5673
      - "15673:15672" # Changed Admin UI port to 15673
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - task_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  task_network:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
